services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - ./app:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - redis
    command: php artisan serve --host=0.0.0.0 --port=8000

  mailpit:
    image: axllent/mailpit
    ports:
      - 1025:1025
      - 8025:8025
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: 2
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
